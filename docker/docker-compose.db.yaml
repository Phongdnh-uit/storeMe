services:
  postgres:
    image: "postgres:latest"
    environment:
      - POSTGRES_DB=${DB_NAME:-mydatabase}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
      - POSTGRES_USER=${DB_USERNAME:-myuser}
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - backend
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    networks:
      - backend
