spring:
  application:
    name: storeMe
  flyway:
    enabled: true
    baseline-on-migrate: true
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver
  profiles:
    active: dev
  redis:
    host: localhost
    port: 6379

jwt:
  secret: cai-secretkey-nay-dung-de-test-thoi-khong-dung-thuc-te-va-yeu-cau-do-dai-secret-512bit
  # access-token-expiration: 3600000
  # refresh-token-expiration: 86400000
  access-token-expiration: 3600000 # 60 minute
  refresh-token-expiration: 120000000 # 2 minutes
